on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      
    steps:

      - name: Check out repository
        uses: actions/checkout@v6

      # Install system deps needed by R packages (curl in particular)
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libicu-dev \
            zlib1g-dev \
            pkg-config \
            build-essential \
            gfortran \
            cmake \
            libmpfr-dev \
            libgmp-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libsqlite3-dev \
            libtbb-dev \
            libglpk-dev \
            jags \
            imagemagick libmagick++-dev \
            inkscape \
            libpoppler-cpp0t64 libpoppler-cpp-dev \
            librsvg2-bin \
            fonts-ebgaramond fonts-open-sans \
            fonts-roboto fonts-noto-color-emoji \
            fonts-dejavu-core fonts-noto-mono fonts-firacode \
            fontconfig

          fc-cache -f
          fc-list | grep -Ei 'garamond|open sans|roboto mono|emoji' || true

          # texlive-fonts-extra \

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Install Python and Dependencies
        id: py
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.3'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv pip install --system -r requirements.txt


      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true   # enables Posit binaries
        # with:
        #   tinytex: true

      - name: R diagnostics
        run: |
          Rscript -e 'R.version.string'
          Rscript -e 'getOption("repos")'
          Rscript -e 'cat("RSPM=", Sys.getenv("RSPM"), "\n")'

      # - name: Cache R packages
      #   uses: actions/cache@v5
      #   with:
      #     path: ~/.cache/R/renv
      #     key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
      #     restore-keys: ${{ runner.os }}-renv-


      # Relax warnings only if fallback source builds occur
      - name: Relax C++ warnings
        run: |
          mkdir -p ~/.R
          {
            echo 'CXX17FLAGS=-g -O2 -Wno-error=format-security'
            echo 'CXX14FLAGS=-g -O2 -Wno-error=format-security'
            echo 'CXX11FLAGS=-g -O2 -Wno-error=format-security'
          } > ~/.R/Makevars

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 2
          bypass-cache: never
        env:
          RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest
          RENV_CONFIG_PAK_ENABLED: "false"
          RENV_DOWNLOAD_METHOD: libcurl
        # env:
        #   RENV_CONFIG_RSPM: https://packagemanager.posit.co/cran/__linux__/noble/latest
        #   # Disable GLPK when building igraph from source
        #   RENV_CONFIG_BUILD_BINARY: "TRUE"
          
    # From https://github.com/julia-actions/setup-julia
      # - name: Setup Julia
      #   uses: julia-actions/setup-julia@v1


      # Install TinyTeX (pdflatex + latexmk) with caching a few LaTeX pkgs often needed by TikZ
      - uses: r-lib/actions/setup-tinytex@v2
      
      - name: tlmgr install common Lua/Xe deps
        run: |
          tlmgr install latexmk amsmath xcolor pgf standalone preview
          tlmgr install fontspec luaotfload unicode-math
          # TeX Live’s Libertinus package (not strictly needed if system OTFs are found, but harmless):
          tlmgr install libertinus-fonts

      - name: Render 
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Force reticulate (R engine) to this Python:
          RETICULATE_PYTHON: ${{ steps.py.outputs.python-path }}
          # Force Quarto’s Python engine (Jupyter) to this Python:
          QUARTO_PYTHON: ${{ steps.py.outputs.python-path }}

      
      - name: Publish to GitHub Pages  
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions
          
