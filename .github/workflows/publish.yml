on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true   # enables Posit binaries
        # with:
        #   tinytex: true

      # Install system deps needed by R packages (curl in particular)
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libicu-dev \
            zlib1g-dev \
            pkg-config \
            build-essential \
            gfortran \
            cmake \
            libmpfr-dev \
            libgmp-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libsqlite3-dev \
            libtbb-dev \
            libglpk-dev \
            jags \
            imagemagick libmagick++-dev \
            libpoppler-cpp0t64 libpoppler-cpp-dev \
            librsvg2-bin 
      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/R/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
          restore-keys: ${{ runner.os }}-renv-

      # Relax warnings only if fallback source builds occur
      - name: Relax C++ warnings
        run: |
          mkdir -p ~/.R
          {
            echo 'CXX17FLAGS=-g -O2 -Wno-error=format-security'
            echo 'CXX14FLAGS=-g -O2 -Wno-error=format-security'
            echo 'CXX11FLAGS=-g -O2 -Wno-error=format-security'
          } > ~/.R/Makevars

      # ✅ Install TinyTeX (pdflatex + latexmk) with caching
      - uses: r-lib/actions/setup-tinytex@v2

      # (Optional) preinstall a few LaTeX pkgs often needed by TikZ
      - name: tlmgr install common TikZ deps
        run: |
          tlmgr install latexmk amsmath xcolor pgf standalone preview



      # # Install LaTeX for PDF output
      # - name: Install latex
      #   run: |
      #     sudo apt-get install -y --no-install-recommends \
      #       texlive-latex-recommended \
      #       texlive-latex-extra \
      #       texlive-fonts-recommended

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1
        # env:
        #   RENV_CONFIG_RSPM: https://packagemanager.posit.co/cran/__linux__/noble/latest
        #   # Disable GLPK when building igraph from source
        #   RENV_CONFIG_BUILD_BINARY: "TRUE"
          

      - name: Install Python and Dependencies
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'
          cache: 'pip'

      #- name: Install pybind11 numpy, wheel, and jupyter for build
      #  run: pip install "pybind11<2.13" "numpy<3" jupyter wheel

      - name: Install Python dependencies
        #run: pip install -r requirements.txt
        run: |
          "${{ steps.py.outputs.python-path }}" -m pip install -U pip
          if [ -f requirements.txt ]; then
            "${{ steps.py.outputs.python-path }}" -m pip install -r requirements.txt
          fi

      #   # Export expanded include paths for the next step
      # - name: Set include flags
      #   run: |
      #     PYBIND11_INCLUDE=$(python -c 'import pybind11; print(pybind11.get_include())')
      #     NUMPY_INCLUDE=$(python -c 'import numpy; print(numpy.get_include())')
      #     echo "CFLAGS=-I${PYBIND11_INCLUDE} -I${NUMPY_INCLUDE}" >> $GITHUB_ENV
      #     echo "CXXFLAGS=-I${PYBIND11_INCLUDE} -I${NUMPY_INCLUDE}" >> $GITHUB_ENV
      #     # (optional) also force the include search path for C++
      #     echo "CPLUS_INCLUDE_PATH=${PYBIND11_INCLUDE}:${NUMPY_INCLUDE}" >> $GITHUB_ENV

      # # Now build pyjags without isolation, using the pre-set flags
      # - name: Build pyjags (no isolation)
      #   run: pip install --no-build-isolation pyjags


    # From https://github.com/julia-actions/setup-julia
      # - name: Setup Julia
      #   uses: julia-actions/setup-julia@v1




      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Force reticulate (R engine) to this Python:
          RETICULATE_PYTHON: ${{ steps.py.outputs.python-path }}
          # Force Quarto’s Python engine (Jupyter) to this Python:
          QUARTO_PYTHON: ${{ steps.py.outputs.python-path }}

          
